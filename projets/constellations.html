<style>:root{--bg:#0E1116;--panel:#161B22;--line:#2A323D;--line2:#3A4554;--text:#E6EDF3;--soft:#C5CED9;--muted:#8C97A5;--nav:#B6C0CC;--accent:#7EE0B5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding-left:24px;padding-right:24px}
.mono{font-family:'JetBrains Mono',monospace}.display{font-family:'Space Grotesk',sans-serif}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:28px;padding-bottom:28px}
.logo{font-size:15px;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.navlink{padding:10px 14px;color:var(--nav);text-decoration:none;font-size:15px}.navlink:hover{color:var(--text)}
.lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.lang button{padding:8px 12px;min-height:40px;border:0;cursor:pointer;font:500 13px 'JetBrains Mono',monospace;background:transparent;color:var(--nav)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
main{padding-top:40px;padding-bottom:96px;display:flex;flex-direction:column;gap:18px}
.kicker{margin:0;font-size:14px;color:var(--accent)}
h1{margin:0;font-size:clamp(36px,6vw,56px);line-height:1.05;letter-spacing:-.02em}
.lede{margin:0;font-size:21px;line-height:1.5;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:12px;padding-top:6px}
.btn{display:inline-block;padding:14px 22px;border-radius:10px;text-decoration:none;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:var(--bg);font-weight:500}
.btn-ghost{border:1px solid var(--line2);color:var(--text)}
.note{margin:0;font-size:13px;color:var(--muted)}
.block{padding-top:28px;border-top:1px solid var(--line);margin-top:10px}
.block h2{margin:0 0 10px;font-size:24px}
.block p{margin:0;color:var(--soft)}
.block ul{margin:0;padding-left:20px;color:var(--soft);display:flex;flex-direction:column;gap:8px}
.others{display:flex;flex-wrap:wrap;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:transform .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.other{flex:1 1 240px;padding:18px 20px;color:var(--text);text-decoration:none;font-family:'Space Grotesk',sans-serif;font-size:18px}
footer{padding-top:24px;padding-bottom:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.btn,.card{transition:none}}
</style>
</head>

<header class="wrap">

<main class="wrap" id="main"><h1 class="display">CONSTELLATIONS</h1><p class="lede">Mesurer l&#x27;effet des transitions de soins sur des personnes âgées atteintes de troubles neurocognitifs majeurs et sur leurs proches aidants.</p></main>
<footer class="wrap mono">© <span id="year">2026</span> Marck-Land · Québec</footer>
<script>
const D = {"p": {"fr": {"meta": "Biostatistique · Projet de fin d'études", "title": "CONSTELLATIONS", "lede": "Mesurer l'effet des transitions de soins sur des personnes âgées atteintes de troubles neurocognitifs majeurs et sur leurs proches aidants.", "context": "Projet de fin d'études en statistique (STT-3300/3400, Université Laval), réalisé en équipe sous la supervision de professeurs du département. L'objectif : analyser l'évolution de la santé et du recours aux soins de patients âgés et de leurs aidants au fil de leur parcours de soins.", "data": "Étude longitudinale de 103 dyades patient-aidant suivies à plusieurs reprises. Les données sont cliniques et confidentielles : le code publié fonctionne avec des données simulées de même structure.", "method": ["Quatre objectifs : fardeau de l'aidant (Zarit), qualité de vie (EQ-5D-5L), visites à l'urgence et relation avec l'équipe de soins (PESQ).", "Modèles linéaires mixtes à mesures répétées, avec comparaison de six structures de covariance (AR(1), CAR(1), symétrie composée, non structurée…) selon l'AIC et le BIC.", "Régression de Poisson à effets mixtes avec offset pour les visites à l'urgence, comparée aux modèles binomial négatif et à zéros enflés, puis diagnostics de surdispersion.", "Vérification de la colinéarité (GVIF), validation des postulats sur les résidus mis à l'échelle et comparaisons multiples avec emmeans (Tukey, Bonferroni)."], "results": ["Chaque service de soutien à domicile supplémentaire est associé à 41 % de visites à l'urgence en moins (IRR = 0,59 ; IC 95 % [0,37 ; 0,94] ; p = 0,026).", "La qualité de vie des usagers diminue au fil du suivi (0,509 à T0, 0,430 à T15) et elle est plus élevée chez ceux recrutés en GMF (0,588) qu'en soutien à domicile (0,424) ou à l'urgence (0,392).", "Le fardeau des aidants est plus élevé chez les dyades recrutées à l'urgence, à T0 et à T9.", "Une plus grande activation de l'aidant est associée à une meilleure relation perçue avec l'équipe de soins (β = 0,868 ; p = 0,005)."], "deliverables": ["Code R complet, exécutable avec des données simulées", "Rapport d'analyse de l'objectif 3", "Présentation des résultats, en équipe avec Abdoulaye Sadio"], "tags": ["R", "Modèles mixtes", "Poisson", "emmeans", "Données longitudinales"]}, "en": {"meta": "Biostatistics · Capstone project", "title": "CONSTELLATIONS", "lede": "Measuring how care transitions affect older adults with major neurocognitive disorders and their family caregivers.", "context": "Capstone project in statistics (STT-3300/3400, Université Laval), carried out as a team under the supervision of department faculty. The goal: analyze how the health and care use of older patients and their caregivers evolve along their care pathway.", "data": "Longitudinal study of 103 patient-caregiver dyads followed over several visits. The data are clinical and confidential, so the published code runs on simulated data with the same structure.", "method": ["Four objectives: caregiver burden (Zarit), quality of life (EQ-5D-5L), emergency visits and relationship with the care team (PESQ).", "Repeated-measures linear mixed models, comparing six covariance structures (AR(1), CAR(1), compound symmetry, unstructured…) by AIC and BIC.", "Poisson mixed-effects regression with an offset for emergency visits, compared with negative binomial and zero-inflated models, followed by overdispersion diagnostics.", "Collinearity checks (GVIF), assumption checks on scaled residuals, and multiple comparisons with emmeans (Tukey, Bonferroni)."], "results": ["Each additional home-care service is associated with 41% fewer emergency visits (IRR = 0.59; 95% CI [0.37, 0.94]; p = 0.026).", "Patients' quality of life declines over follow-up (0.509 at T0, 0.430 at T15) and is higher for those recruited in family medicine clinics (0.588) than in home care (0.424) or the emergency department (0.392).", "Caregiver burden is higher for dyads recruited in the emergency department, at T0 and T9.", "Higher caregiver activation is associated with a better perceived relationship with the care team (β = 0.868; p = 0.005)."], "deliverables": ["Complete R code, runnable on simulated data", "Analysis report for objective 3", "Results presentation, delivered with Abdoulaye Sadio"], "tags": ["R", "Mixed models", "Poisson", "emmeans", "Longitudinal data"]}}, "L": {"fr": {"back": "← Tous les projets", "context": "Contexte", "data": "Données", "method": "Démarche", "deliv": "Livrables", "results": "Résultats clés", "tools": "Outils", "code": "Voir le code", "codeReq": "Code disponible sur demande", "codeNote": "Le code sera publié sur GitHub prochainement.", "contact": "Me contacter", "other": "Autres projets"}, "en": {"back": "← All projects", "context": "Context", "data": "Data", "method": "Approach", "deliv": "Deliverables", "results": "Key findings", "tools": "Tools", "code": "View the code", "codeReq": "Code available on request", "codeNote": "The code will be published on GitHub soon.", "contact": "Contact me", "other": "Other projects"}}, "code": null, "others": [{"slug": "rapach-2013", "fr": "Réplication de Rapach et al. (2013)", "en": "Replicating Rapach et al. (2013)"}]};
function el(t, c, x) { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
function sec(title, body) { const s = el('section', 'block'); s.append(el('h2', 'display', title)); s.append(...[].concat(body)); return s; }
function list(items) { const u = el('ul'); items.forEach(i => u.append(el('li', null, i))); return u; }
function render(lang) {
  const p = D.p[lang], L = D.L[lang];
  document.documentElement.lang = lang;
  document.title = p.title + ' — Marck-Land';
  document.getElementById('back').textContent = L.back;
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const tags = el('div', 'tags'); p.tags.forEach(t => tags.append(el('span', 'tag mono', t)));
  const actions = el('div', 'actions');
  if (D.code) { const a = el('a', 'btn btn-primary', L.code); a.href = D.code; a.target = '_blank'; a.rel = 'noopener'; actions.append(a); }
  else { const a = el('a', 'btn btn-ghost', L.codeReq); a.href = 'mailto:contact@marckland.com?subject=' + encodeURIComponent(p.title); actions.append(a); }
  const others = el('div', 'others'); D.others.forEach(o => { const a = el('a', 'card other', o[lang] + ' →'); a.href = o.slug + '.html'; others.append(a); });
  document.getElementById('main').replaceChildren(
    el('p', 'kicker mono', p.meta), el('h1', 'display', p.title), el('p', 'lede', p.lede), tags, actions,
    D.code ? el('span') : el('p', 'note mono', L.codeNote),
    sec(L.context, el('p', null, p.context)), sec(L.data, el('p', null, p.data)),
    sec(L.method, list(p.method)), p.results ? sec(L.results, list(p.results)) : el('span'), sec(L.deliv, list(p.deliverables)),
    sec(L.other, others));
}
let lang = 'fr';
try { const s = localStorage.getItem('lang'); if (s === 'fr' || s === 'en') lang = s; } catch (e) {}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} render(lang); }));
document.getElementById('year').textContent = new Date().getFullYear();
render(lang);
</script>
