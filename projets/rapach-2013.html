<style>:root{--bg:#0E1116;--panel:#161B22;--line:#2A323D;--line2:#3A4554;--text:#E6EDF3;--soft:#C5CED9;--muted:#8C97A5;--nav:#B6C0CC;--accent:#7EE0B5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding-left:24px;padding-right:24px}
.mono{font-family:'JetBrains Mono',monospace}.display{font-family:'Space Grotesk',sans-serif}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:28px;padding-bottom:28px}
.logo{font-size:15px;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.navlink{padding:10px 14px;color:var(--nav);text-decoration:none;font-size:15px}.navlink:hover{color:var(--text)}
.lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.lang button{padding:8px 12px;min-height:40px;border:0;cursor:pointer;font:500 13px 'JetBrains Mono',monospace;background:transparent;color:var(--nav)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
main{padding-top:40px;padding-bottom:96px;display:flex;flex-direction:column;gap:18px}
.kicker{margin:0;font-size:14px;color:var(--accent)}
h1{margin:0;font-size:clamp(36px,6vw,56px);line-height:1.05;letter-spacing:-.02em}
.lede{margin:0;font-size:21px;line-height:1.5;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:12px;padding-top:6px}
.btn{display:inline-block;padding:14px 22px;border-radius:10px;text-decoration:none;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:var(--bg);font-weight:500}
.btn-ghost{border:1px solid var(--line2);color:var(--text)}
.note{margin:0;font-size:13px;color:var(--muted)}
.block{padding-top:28px;border-top:1px solid var(--line);margin-top:10px}
.block h2{margin:0 0 10px;font-size:24px}
.block p{margin:0;color:var(--soft)}
.block ul{margin:0;padding-left:20px;color:var(--soft);display:flex;flex-direction:column;gap:8px}
.others{display:flex;flex-wrap:wrap;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:transform .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.other{flex:1 1 240px;padding:18px 20px;color:var(--text);text-decoration:none;font-family:'Space Grotesk',sans-serif;font-size:18px}
footer{padding-top:24px;padding-bottom:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.btn,.card{transition:none}}
</style>

<body>
<header class="wrap">

<main class="wrap" id="main"><h1 class="display">Réplication de Rapach et al. (2013)</h1><p class="lede">Reconstruire la base de données d&#x27;un article de référence sur la prévisibilité des rendements boursiers internationaux, puis l&#x27;étendre.</p></main>
<footer class="wrap mono">© <span id="year">2026</span> Marck-Land · Québec</footer>
<script>
const D = {"p": {"fr": {"meta": "Économétrie financière · Assistanat de recherche", "title": "Réplication de Rapach et al. (2013)", "lede": "Reconstruire la base de données d'un article de référence sur la prévisibilité des rendements boursiers internationaux, puis l'étendre.", "context": "Rapach, Strauss et Zhou (2013, Journal of Finance) montrent que les rendements passés du marché américain aident à prévoir ceux des autres grands marchés boursiers. Comme assistant de recherche du professeur Fu (Université Laval), j'ai préparé les données nécessaires pour reproduire ces résultats et les prolonger sur une période plus récente.", "data": "Séries mensuelles d'indices boursiers de plusieurs pays (Global Financial Data). Quand une série d'origine n'était plus disponible, j'ai trouvé et validé un équivalent, par exemple l'indice Topix à rendement total pour le Japon.", "method": ["Pipelines Python reproductibles : téléchargement, nettoyage, harmonisation des dates et calcul des rendements.", "Base de données maîtresse en panel (pays × mois), avec contrôles de cohérence automatiques.", "Statistiques descriptives en Python et en Stata, recoupées pour valider les deux chaînes de calcul.", "Cadre économétrique de l'article : régressions prédictives, erreurs types de Newey-West, causalité de Granger."], "deliverables": ["Base de données en panel validée", "Scripts de statistiques descriptives (Python et Stata)", "Dictionnaire des variables", "Document de méthodologie"], "tags": ["Python", "Stata", "Données de panel", "Newey-West", "Granger"]}, "en": {"meta": "Financial econometrics · Research assistantship", "title": "Replicating Rapach et al. (2013)", "lede": "Rebuilding the dataset behind a landmark paper on international stock return predictability, then extending it.", "context": "Rapach, Strauss and Zhou (2013, Journal of Finance) show that lagged U.S. market returns help predict returns in other major stock markets. As a research assistant to Professor Fu (Université Laval), I prepared the data needed to reproduce these results and extend them to a more recent period.", "data": "Monthly stock index series for several countries (Global Financial Data). When an original series was no longer available, I found and validated an equivalent, such as the Topix total return index for Japan.", "method": ["Reproducible Python pipelines: download, cleaning, date alignment and return computation.", "Master panel database (country × month) with automated consistency checks.", "Descriptive statistics in both Python and Stata, cross-checked to validate both workflows.", "The paper's econometric framework: predictive regressions, Newey-West standard errors, Granger causality."], "deliverables": ["Validated panel database", "Descriptive statistics scripts (Python and Stata)", "Variable dictionary", "Methodology document"], "tags": ["Python", "Stata", "Panel data", "Newey-West", "Granger"]}}, "L": {"fr": {"back": "← Tous les projets", "context": "Contexte", "data": "Données", "method": "Démarche", "deliv": "Livrables", "results": "Résultats clés", "tools": "Outils", "code": "Voir le code", "codeReq": "Code disponible sur demande", "codeNote": "Le code sera publié sur GitHub prochainement.", "contact": "Me contacter", "other": "Autres projets"}, "en": {"back": "← All projects", "context": "Context", "data": "Data", "method": "Approach", "deliv": "Deliverables", "results": "Key findings", "tools": "Tools", "code": "View the code", "codeReq": "Code available on request", "codeNote": "The code will be published on GitHub soon.", "contact": "Contact me", "other": "Other projects"}}, "code": null, "others": [{"slug": "constellations", "fr": "CONSTELLATIONS", "en": "CONSTELLATIONS"}]};
function el(t, c, x) { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
function sec(title, body) { const s = el('section', 'block'); s.append(el('h2', 'display', title)); s.append(...[].concat(body)); return s; }
function list(items) { const u = el('ul'); items.forEach(i => u.append(el('li', null, i))); return u; }
function render(lang) {
  const p = D.p[lang], L = D.L[lang];
  document.documentElement.lang = lang;
  document.title = p.title + ' — Marck-Land';
  document.getElementById('back').textContent = L.back;
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const tags = el('div', 'tags'); p.tags.forEach(t => tags.append(el('span', 'tag mono', t)));
  const actions = el('div', 'actions');
  if (D.code) { const a = el('a', 'btn btn-primary', L.code); a.href = D.code; a.target = '_blank'; a.rel = 'noopener'; actions.append(a); }
  else { const a = el('a', 'btn btn-ghost', L.codeReq); a.href = 'mailto:contact@marckland.com?subject=' + encodeURIComponent(p.title); actions.append(a); }
  const others = el('div', 'others'); D.others.forEach(o => { const a = el('a', 'card other', o[lang] + ' →'); a.href = o.slug + '.html'; others.append(a); });
  document.getElementById('main').replaceChildren(
    el('p', 'kicker mono', p.meta), el('h1', 'display', p.title), el('p', 'lede', p.lede), tags, actions,
    D.code ? el('span') : el('p', 'note mono', L.codeNote),
    sec(L.context, el('p', null, p.context)), sec(L.data, el('p', null, p.data)),
    sec(L.method, list(p.method)), p.results ? sec(L.results, list(p.results)) : el('span'), sec(L.deliv, list(p.deliverables)),
    sec(L.other, others));
}
let lang = 'fr';
try { const s = localStorage.getItem('lang'); if (s === 'fr' || s === 'en') lang = s; } catch (e) {}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} render(lang); }));
document.getElementById('year').textContent = new Date().getFullYear();
render(lang);
</script>
